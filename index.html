<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123743">
<title>小記者出動：電費要加了嗎？</title>
<style>
:root{color-scheme:light;--ink:#123441;--muted:#425c63;--deep:#123743;--teal:#075d59;--pale:#e4f2ed;--paper:#fffdf7;--cream:#f7f2e7;--line:#d4ded8;--gold:#f3ce71;font-family:"PingFang HK","Noto Sans CJK HK","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-size:1.125rem;line-height:1.65}h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.32}button{font:inherit;cursor:pointer;touch-action:manipulation;border:1px solid transparent;border-radius:12px;min-height:48px;padding:8px 15px;color:inherit;background:white}button:focus-visible,summary:focus-visible{outline:3px solid #805300;outline-offset:3px}button:hover:not(:disabled){filter:brightness(.96)}button:disabled{cursor:default;opacity:.58}[hidden]{display:none!important}
header{background:var(--deep);color:white}.bar{max-width:1220px;margin:auto;padding:11px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:1.19rem;letter-spacing:.04em}.brand span{background:var(--gold);color:var(--deep);border-radius:10px;width:39px;height:39px;display:grid;place-items:center}.tools{display:flex;flex-wrap:wrap;gap:8px}.bar button{background:#214b58;border-color:#76909a;color:white;font-size:1rem}
main{max-width:1200px;margin:auto;padding:24px 24px 42px}.hero{display:grid;grid-template-columns:1.14fr 1fr;overflow:hidden;min-height:420px;border-radius:26px;background:var(--deep);color:white;box-shadow:0 13px 28px #21383a20}.hero img{height:100%;width:100%;object-fit:cover;object-position:23% center;min-height:280px}.hero-copy{padding:clamp(22px,4.8vw,66px);align-self:center}.eyebrow{color:var(--gold);font-weight:750;letter-spacing:.07em}.hero h1{font-size:clamp(2.15rem,5vw,4.6rem);margin:10px 0 16px;letter-spacing:.015em}.hero p{max-width:30ch}.primary,.gold{font-size:1.14rem;font-weight:800;padding:10px 23px}.primary{background:var(--teal);color:white}.gold{background:var(--gold);color:var(--deep)}.hero .gold{margin-top:23px}.route{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:17px 0 0;padding:0;list-style:none}.route li{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 15px;font-weight:730}.route li span{display:block;font-size:1rem;color:var(--muted);font-weight:500}.route li[aria-current]{border-color:var(--teal);background:var(--pale)}.progress{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 15px;font-weight:740;margin:0 0 6px}.meter{height:8px;border-radius:999px;background:#d6e4de;overflow:hidden;margin-bottom:18px}.meter i{display:block;height:100%;background:var(--teal);width:0}
.layout{display:grid;grid-template-columns:minmax(220px,.75fr) minmax(0,1.5fr);align-items:start;gap:20px}.scene,.activity,.finish{border:1px solid var(--line);background:var(--paper);overflow:hidden;border-radius:20px}.scene img{display:block;width:100%;height:auto;aspect-ratio:1.25;object-fit:cover}.scene figcaption{padding:12px 17px;font-size:1rem;color:var(--muted)}figure{margin:0}.activity,.finish{padding:clamp(14px,2.8vw,30px)}.source{padding:13px 15px;background:var(--pale);border-radius:13px;margin-bottom:15px}.source-line{display:block;max-width:36ch}.source p{margin-top:5px;font-size:1.1rem}.with-audio,.footer,.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.with-audio h2{font-size:clamp(1.3rem,3vw,1.83rem);flex:1 1 235px}.source strong{font-weight:850;color:#174f4a}.speak{min-width:52px;background:#f8fbf8;border:1px solid #9db8ac;color:#144d49;font-size:1rem;font-weight:730;padding:7px 11px}.icon{display:inline-block;width:21px;height:21px;vertical-align:-4px;margin-right:4px}.speak.icon-only .icon{margin-right:0}.speak.icon-only{padding:7px}
.choices{display:grid;gap:8px;margin-top:12px}.choice{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.answer{display:flex;align-items:center;text-align:left;gap:11px;border-color:#aac2b6;background:white;font-weight:700;padding:9px 12px;min-height:54px;font-size:clamp(1.075rem,2vw,1.23rem);line-height:1.5}.letter{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:8px;background:var(--pale);color:#134c45;font-size:1rem}.answer[data-state=wrong]{background:#fff1da;border-color:#986023}.answer[data-state=right]{background:#d7f1df;border:2px solid #176741;opacity:1}.speaking{outline:3px solid #a26909;outline-offset:1px;background:#ffefbd!important;border-radius:4px}.feedback{margin-top:12px;padding:10px 13px;border-radius:12px;background:#fff1da;color:#603d0b}.feedback.good{background:#e3f3e9;color:#16492f}.footer{margin-top:12px;justify-content:flex-end}.quiet{background:transparent;border-color:#9cb2a8}.finish{max-width:800px;margin:auto}.finish h1{font-size:clamp(1.8rem,4vw,3rem);margin-bottom:8px}.news{border-top:4px solid var(--teal);background:var(--cream);padding:16px 20px;margin:17px 0;border-radius:8px}.news p+p{margin-top:10px}.finish .route{margin-bottom:18px}.loading{color:var(--muted)}.status{font-size:1rem;margin-bottom:10px;background:#fff0c2;border-radius:10px;padding:8px 12px;color:#593b03}.route-bottom{margin-top:14px}
dialog{max-width:660px;width:min(94vw,660px);max-height:82vh;border:1px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);padding:18px 23px}dialog::backdrop{background:#102c39a0}dialog h2{font-size:1.55rem}.dialog-head{position:sticky;top:-19px;background:var(--paper);z-index:1;padding:6px 0;border-bottom:1px solid var(--line)}details{margin:10px 0;border:1px solid var(--line);padding:9px 12px;border-radius:10px}summary{font-weight:750;cursor:pointer;min-height:34px}details p{margin:4px 0}.notes{padding-left:22px}.notes li{margin:8px 0}
@media(max-width:760px){main{padding:15px 13px 30px}.bar{padding:9px 13px;flex-wrap:wrap}.hero{grid-template-columns:1fr}.hero img{min-height:0;height:auto;aspect-ratio:2;object-position:22% 39%}.hero-copy{padding:23px}.layout{grid-template-columns:1fr;gap:10px}.scene{display:flex;align-items:center;gap:4px}.scene img{width:110px;height:80px;aspect-ratio:auto}.scene figcaption{padding:6px 9px}.route{gap:6px}.route li{padding:7px;font-size:.96rem}.route li span{font-size:.85rem}.activity{border-radius:15px}.source{padding:9px 10px}.choice{gap:5px}.answer{padding:7px 8px}.tools button{font-size:.93rem;padding-inline:9px}.route-bottom{display:none}}
</style>
</head>

  {stage:1, art:'chan', source:'陳先生', lines:['我夏天每月要付八百多元電費。','我擔心再加價，低收入人士會更難負擔。'], ask:'陳先生最擔心甚麼？', choices:['低收入人士更難付電費。','中產家庭的開支會增加。','市民加價後會減少用電。','平時用電少的人受影響較小。'], hint:'重讀最後一句，找出他擔心哪一類人。', explain:'陳先生擔心低收入人士更難負擔電費。', note:true},
  {stage:1, art:'tse', source:'謝女士', lines:['公司提出加電費，也說會減免電費。','我擔心中產家庭最後要多付電費。'], ask:'哪一句是謝女士的看法？', choices:['中產家庭可能要多付電費。','低收入家庭可能付不起電費。','市民加價後可能會少用電。','平時用電少，加價影響也小。'], hint:'重聽最後一句，留意她擔心哪一類家庭。', explain:'謝女士擔心中產家庭要多付電費。', note:true},
  {stage:1, art:'cheung', source:'張同學', lines:['我贊成加電費，因為市民可能會少用電。','我也希望多收的電費可以用在環保方面。'], ask:'張同學為甚麼贊成加電費？', choices:['他認為市民會減少用電。','他認為市民會獲得減免。','他認為中產開支會減少。','他認為市民會多開冷氣。'], hint:'找出第一句「因為」後面的原因。', explain:'張同學認為加電費可令人少用電，達到節能效果。', note:true},
  {stage:1, art:'leung', source:'梁伯', lines:['我家沒有安裝冷氣機，平時用電較少。','我覺得加電費對我的影響不大。'], ask:'為甚麼梁伯覺得加價影響不大？', choices:['他平時用電較少。','他在夏天常開冷氣。','他可獲電費減免。','他希望大家多用電。'], hint:'重聽第一句，留意他的用電習慣。', explain:'梁伯平時用電較少，所以覺得加價影響不大。', note:true},
  {stage:2, source:'查證提示', lines:['事實是可以核對的資料。','意見是人物的看法。'], ask:'哪一句是可核對的事實？', choices:['公司舉行了股東周年大會。','陳先生認為加價不公平。','張同學認為加價可節能。','梁伯覺得加價影響不大。'], hint:'找出一句交代已發生的事情。', explain:'公司舉行了股東周年大會，可以核對會議資料。'},
  {stage:2, source:'查證提示', lines:['公司公布過的計劃也是可核對的資料。','意見會告訴我們某人怎樣想。'], ask:'哪一句寫出市民的意見？', choices:['張同學認為加價可節能。','公司公布了加價計劃。','大會在香港會議展覽中心舉行。','代表在會上公開文件。'], hint:'找出一句說某人「認為」會怎樣。', explain:'「加價可節能」是張同學的看法。'},
  {stage:2, source:'新聞簡報 · 第一句', lines:['先寫新聞的主要事件。'], ask:'哪一句適合放在簡報開頭？', choices:['光明電力公司計劃加電費，建議將交立法會審議。','光明電力公司已加電費，並已開始提供電費減免。','光明電力公司計劃減電費，建議將交立法會審議。','光明電力公司計劃加電費，建議已獲立法會通過。'], hint:'回想第一關，公司提出加價時仍在計劃階段。', explain:'這句交代加價計劃和建議的去向。', draft:true},
  {stage:2, source:'新聞簡報 · 第二句', lines:['接着交代公司提出加價的原因。'], ask:'哪一句準確交代加價原因？', choices:['公司表示營運成本上升，也打算研究潔淨能源發電。','公司表示營運成本下降，也打算研究潔淨能源發電。','公司表示營運成本上升，也打算停止研究潔淨能源。','公司表示營運成本下降，也打算停止研究潔淨能源。'], hint:'回想公司提到的營運成本，還有計劃研究甚麼。', explain:'這句交代成本上升和研究潔淨能源兩個原因。', draft:true},
  {stage:2, source:'新聞簡報 · 第三句', lines:['最後交代公司的減免承諾。'], ask:'哪一句清楚交代援助何時提供？', choices:['加價獲立法會通過後，公司會提供電費減免。','公司公布加價計劃後，便會提供電費減免。','股東大會結束後，公司便會提供電費減免。','市民接受訪問後，公司便會提供電費減免。'], draftText:'如果加價獲立法會通過，公司承諾向低收入家庭和領取綜援人士提供電費減免。', hint:'留意課文的「如果」條件，由哪個機構通過加價？', explain:'課文交代，要等立法會通過加價，公司才會提供減免援助。', draft:true}
];

const glossary = [
  ['成本','提供服務或製造產品所花的費用。'],
  ['傳媒','向大眾傳播消息的機構或媒體，如報章、電台和電視台。'],
  ['採訪','記者透過訪問或到現場搜集資料。'],
  ['薪酬','工作所得的報酬。'],
  ['效能','一件東西的功能或使用效果。'],
  ['承諾','答應會做某件事。'],
  ['援助','給有需要的人幫助。'],
  ['舒緩','使壓力或不適減輕。'],
  ['剝奪','強行取走別人原有的權利或財物。'],
  ['懷疑','對一件事有疑問。'],
  ['自相矛盾','同一人的說法或做法互相衝突。'],
  ['節能','節約能源，例如少用電。'],
  ['審議','審查和討論建議。'],
  ['減免','減少或免去需要繳交的費用。']
];
const screen = document.querySelector('#screen');
const panel = document.querySelector('#panel');
const panelBody = document.querySelector('#panel-body');
const audioStatus = document.querySelector('#audio-status');
const synth = window.speechSynthesis;
const files = [];
let index = -1;
let order = [];
let solved = false;
let attempts = 0;
let firstTry = 0;
let activeSpeaker;
let utterance;
let voiceRate = 0.84;
let notes = [];
let draft = [];

const speakerIcon = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6m2-8a7 7 0 0 1 0 10"/></svg>';
function speechButton(value, label, compact = false) {
  const key = files.push(value) - 1;
  return '<button type="button" class="speak' + (compact ? ' icon-only' : '') + '" data-speech="' + key + '" aria-label="' + label + '">' + speakerIcon + (compact ? '' : label) + '</button>';
}

function cantoneseVoice() {
  const voices = synth?.getVoices() ?? [];
  return voices.find(voice => /^zh[-_]hk$/i.test(voice.lang))
    ?? voices.find(voice => /^yue(?:[-_]|$)/i.test(voice.lang))
    ?? voices.find(voice => /cantonese|sin.ji|hiu.?maan|hiu.?gaai|wan.?lung/i.test(voice.name));
}
function stopSpeech() {
  activeSpeaker?.classList.remove('speaking');
  activeSpeaker = undefined;
  utterance = undefined;
  synth?.cancel();
}
function displayAudioMessage(message) {
  if (panel.open) {
    let status = panelBody.querySelector('[data-audio-message]');
    if (!status) {
      status = document.createElement('p');
      status.className = 'status';
      status.dataset.audioMessage = '';
      status.setAttribute('role', 'status');
      panelBody.prepend(status);
    }
    status.textContent = message;
  } else {
    audioStatus.textContent = message;
    audioStatus.hidden = !message;
  }
}
function speak(value, target) {
  stopSpeech();
  const voice = cantoneseVoice();
  if (!voice) {
    displayAudioMessage('這部裝置暫未提供香港廣東話語音。請在裝置的語音設定加入「中文（香港）」後重試。');
    return;
  }
  displayAudioMessage('');
  const current = new SpeechSynthesisUtterance(value);
  current.voice = voice;
  current.lang = voice.lang;
  current.rate = voiceRate;
  utterance = current;
  activeSpeaker = target;
  target.classList.add('speaking');
  current.onend = () => {
    if (utterance === current) stopSpeech();
  };
  current.onerror = () => {
    if (utterance !== current) return;
    stopSpeech();
    displayAudioMessage('語音暫時未能播放。請再按一次朗讀。');
  };
  synth.speak(current);
}
function shuffled(values) {
  const result = [...values];
  for (let last = result.length - 1; last > 0; last--) {
    const next = Math.floor(Math.random() * (last + 1));
    [result[last], result[next]] = [result[next], result[last]];
  }
  return result;
}
function routes(stage) {
  return '<ol class="route">' + stages.map((item, i) =>
    '<li' + (stage === i ? ' aria-current="step"' : '') + '>' + item.title + '<span>' + item.task + '</span></li>'
  ).join('') + '</ol>';
}
function renderHome() {
  screen.innerHTML = '<section class="hero"><img src="' + artwork.cover + '" alt="學生記者在維港海旁訪問梁伯"><div class="hero-copy"><p class="eyebrow">《新聞報道（三）》課文溫習</p><h1>電費要<br>加了嗎？</h1><p>接下採訪任務。找線索、聽訪問，再寫成一則新聞簡報。</p><button class="gold" type="button" data-start>開始採訪</button></div></section>' + routes(-1);
}
function start() {
  index = 0;
  firstTry = 0;
  notes = [];
  draft = [];
  const positions = shuffled(questions.map((_, i) => i % 4));
  order = questions.map((question, i) => {
    const choices = shuffled(question.choices.slice(1));
    choices.splice(positions[i], 0, question.choices[0]);
    return choices;
  });
  renderQuestion();
}
function renderQuestion() {
  stopSpeech();
  files.length = 0;
  audioStatus.hidden = true;
  solved = false;
  attempts = 0;
  const q = questions[index];
  const stage = stages[q.stage];
  const art = q.art ?? stage.art;
  const lineButtons = speechButton(q.lines.join(' '), q.stage === 1 ? '聽訪問' : '聽資料');
  const allOptions = order[index].map((value, i) => {
    const letter = 'ABCD'[i];
    return '<div class="choice"><button type="button" class="answer" data-answer="' + i + '"><span class="letter">' + letter + '</span><span>' + value + '</span></button>' + speechButton(value, '聽選項 ' + letter, true) + '</div>';
  }).join('');
  screen.innerHTML = '<div class="progress"><span>第 ' + (q.stage + 1) + ' 關　' + stage.title + '</span><span>第 ' + (index + 1) + ' 題 / 共 ' + questions.length + ' 題</span></div>' +
    '<div class="meter" aria-hidden="true"><i style="width:' + (index / questions.length * 100) + '%"></i></div>' +
    '<div class="layout"><figure class="scene"><img src="' + artwork[art] + '" alt=""><figcaption>' + (q.stage === 1 ? '受訪者　' + q.source : stage.title) + '</figcaption></figure>' +
    '<section class="activity"><div class="source"><div class="row"><strong>' + q.source + '</strong>' + lineButtons + '</div><p>' + q.lines.map(line => '<span class="source-line">' + line + '</span>').join('') + '</p></div>' +
    '<div class="with-audio"><h2 id="question" tabindex="-1">' + q.ask + '</h2>' + speechButton(q.ask, '聽題目') + '</div>' +
    '<div class="choices" role="group" aria-labelledby="question">' + allOptions + '</div>' +
    '<div class="feedback" hidden></div><div class="footer"><button class="quiet" type="button" data-hint>看提示</button><button class="primary" type="button" data-next hidden>' + (index === questions.length - 1 ? '查看新聞簡報' : questions[index + 1].stage !== q.stage ? '進入下一關' : '下一題') + '</button></div></section></div><div class="route-bottom">' + routes(q.stage) + '</div>';
  document.querySelector('#question').focus({preventScroll:true});
  window.scrollTo(0, 0);
}
function feedback(text, correct) {
  const box = screen.querySelector('.feedback');
  box.classList.toggle('good', correct);
  box.replaceChildren();
  box.hidden = false;
  const row = document.createElement('div');
  row.className = 'row';
  const announced = document.createElement('span');
  announced.setAttribute('role', 'status');
  row.append(announced);
  row.insertAdjacentHTML('beforeend', speechButton(text, correct ? '聽解說' : '聽提示', true));
  box.append(row);
  announced.textContent = text;
}
function choose(button) {
  if (solved) return;
  const q = questions[index];
  const option = order[index][Number(button.dataset.answer)];
  if (option !== q.choices[0]) {
    attempts++;
    screen.querySelectorAll('[data-state="wrong"]').forEach(item => delete item.dataset.state);
    button.dataset.state = 'wrong';
    feedback('再試一次。' + q.hint, false);
    return;
  }
  solved = true;
  if (attempts === 0) firstTry++;
  if (q.note) notes.push(q.explain);
  if (q.draft) draft.push(q.draftText ?? option);
  screen.querySelectorAll('[data-answer]').forEach(item => {
    delete item.dataset.state;
    item.setAttribute('aria-disabled', 'true');
    item.tabIndex = -1;
    item.disabled = item !== button;
  });
  button.dataset.state = 'right';
  feedback('答對了！' + q.explain + (q.note || q.draft ? ' 已加入記者筆記。' : ''), true);
  screen.querySelector('[data-hint]').hidden = true;
  const next = screen.querySelector('[data-next]');
  next.hidden = false;
}
function renderFinish() {
  stopSpeech();
  files.length = 0;
  audioStatus.hidden = true;
  screen.innerHTML = '<section class="finish"><h1 tabindex="-1">新聞簡報完成！</h1><p>你已完成三關採訪任務。首次答對 ' + firstTry + ' / ' + questions.length + ' 題。</p><article class="news"><h2>電力公司擬加電費</h2>' + draft.map(line => '<p>' + line + '</p>').join('') + '</article><div class="row">' + speechButton(draft.join(' '), '聽新聞簡報') + '<button class="primary" type="button" data-start>再玩一次</button></div></section>';
  screen.querySelector('h1').focus({preventScroll:true});
  window.scrollTo(0, 0);
}
function openPanel(type) {
  stopSpeech();
  const titles = {notes:'記者筆記', words:'詞語手冊', audio:'語音設定'};
  document.querySelector('#panel-title').textContent = titles[type];
  if (type === 'words') {
    panelBody.innerHTML = glossary.map(([word, definition]) =>
      '<details><summary>' + word + '</summary><div class="row"><p>' + definition + '</p>' + speechButton(word + '。' + definition, '聽「' + word + '」') + '</div></details>'
    ).join('');
  }
  if (type === 'notes') {
    const notesList = notes.length ? '<ul class="notes">' + notes.map(note => '<li>' + note + '</li>').join('') + '</ul>' : '<p>完成任務後，找到的資料會出現在這裏。</p>';
    const draftList = draft.length ? '<h3>新聞簡報</h3><ol class="notes">' + draft.map(line => '<li>' + line + '</li>').join('') + '</ol>' : '';
    panelBody.innerHTML = notesList + draftList;
  }
  if (type === 'audio') {
    panelBody.innerHTML = '<p>朗讀使用裝置提供的香港廣東話語音。</p><label for="rate">朗讀速度</label> <select id="rate"><option value="0.72">較慢</option><option value="0.84">稍慢</option><option value="1">正常</option></select><p>' + speechButton('歡迎加入採訪任務。請細心聆聽。', '試聽廣東話') + '</p>';
    const rate = panelBody.querySelector('#rate');
    rate.value = voiceRate;
    rate.addEventListener('change', () => { voiceRate = Number(rate.value); });
  }
  panel.showModal();
}
document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.hasAttribute('data-start')) start();
  if (button.hasAttribute('data-answer')) choose(button);
  if (button.hasAttribute('data-hint')) feedback(questions[index].hint, false);
  if (button.hasAttribute('data-next') && solved) {
    index++;
    if (index === questions.length) renderFinish();
    else renderQuestion();
  }
  if (button.hasAttribute('data-panel')) openPanel(button.dataset.panel);
  if (button.hasAttribute('data-speech')) {
    const target = button.closest('.source, .choice, .with-audio, .feedback, details') ?? button;
    speak(files[Number(button.dataset.speech)], target);
  }
});
document.querySelector('#close-panel').addEventListener('click', () => panel.close());
panel.addEventListener('close', stopSpeech);
synth?.getVoices();
renderHome();
</script>
</body>
</html>
